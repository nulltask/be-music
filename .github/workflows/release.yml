name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_target:
        description: Merge commit SHA or ref to release from
        required: true
        type: string
      release_base:
        description: Base commit SHA or ref to compare against
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_target || github.event.pull_request.merge_commit_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Releases
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'devel')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      release_target: ${{ steps.release_refs.outputs.release_target }}
      release_base: ${{ steps.release_refs.outputs.release_base }}
      has_releases: ${{ steps.release_packages.outputs.has_releases }}
      has_sea_releases: ${{ steps.release_packages.outputs.has_sea_releases }}
      release_player_tui: ${{ steps.release_packages.outputs.release_player_tui }}
      release_audio_renderer: ${{ steps.release_packages.outputs.release_audio_renderer }}
      player_tui_version: ${{ steps.release_packages.outputs.player_tui_version }}
      audio_renderer_version: ${{ steps.release_packages.outputs.audio_renderer_version }}
      releases_json: ${{ steps.release_packages.outputs.releases_json }}
      sea_releases_json: ${{ steps.release_packages.outputs.sea_releases_json }}

    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve release refs
        id: release_refs
        shell: bash
        env:
          MANUAL_RELEASE_TARGET: ${{ github.event.inputs.release_target }}
          MANUAL_RELEASE_BASE: ${{ github.event.inputs.release_base }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_target=$MANUAL_RELEASE_TARGET" >> "$GITHUB_OUTPUT"
            echo "release_base=$MANUAL_RELEASE_BASE" >> "$GITHUB_OUTPUT"
          else
            release_target="${{ github.event.pull_request.merge_commit_sha }}"
            release_base="$(git rev-parse "${release_target}^1")"
            echo "release_target=$release_target" >> "$GITHUB_OUTPUT"
            echo "release_base=$release_base" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve package releases
        id: release_packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx --tsconfig tsconfig.typecheck.json scripts/release/resolve-package-releases.ts \
            --base "${{ steps.release_refs.outputs.release_base }}" \
            --head "${{ steps.release_refs.outputs.release_target }}" \
            --github-output "$GITHUB_OUTPUT" \
            --json-output "$RUNNER_TEMP/package-releases.json"

  sea:
    name: SEA Release (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.has_sea_releases == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout release target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Compute asset metadata
        id: meta
        shell: pwsh
        run: |
          $os = switch ($env:RUNNER_OS) {
            'Linux' { 'linux' }
            'macOS' { 'macos' }
            'Windows' { 'windows' }
            default { throw "Unsupported RUNNER_OS: $env:RUNNER_OS" }
          }
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()

          "archive_suffix=$os-$arch" >> $env:GITHUB_OUTPUT

      - name: Build player SEA executable
        if: needs.prepare.outputs.release_player_tui == 'true'
        # The CLI / TUI bin moved to `@be-music/player-tui` during the player-tui-split refactor; the
        # `build:sea` script lives there now (the SEA bundle still ships under `be-music-player` for
        # backward compatibility with existing release assets).
        run: pnpm --filter @be-music/player-tui run build:sea

      - name: Build audio-renderer SEA executable
        if: needs.prepare.outputs.release_audio_renderer == 'true'
        run: pnpm --filter @be-music/audio-renderer run build:sea

      - name: Sign macOS SEA executables
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGNING_P12_BASE64:-}" ] || [ -z "${MACOS_SIGNING_P12_PASSWORD:-}" ]; then
            echo "MACOS_SIGNING_P12_BASE64 and MACOS_SIGNING_P12_PASSWORD secrets must be configured for release signing." >&2
            exit 1
          fi

          asset_dir="tmp/release-assets"
          signing_dir="tmp/signing/macos"
          keychain_path="$RUNNER_TEMP/be-music-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          pkcs12_legacy_flag=''
          rsa_traditional_cmd=''

          mkdir -p "$asset_dir" "$signing_dir"
          if openssl pkcs12 -help 2>&1 | grep -q -- ' -legacy '; then
            pkcs12_legacy_flag='-legacy'
          fi
          if openssl pkey -help 2>&1 | grep -q -- ' -traditional '; then
            rsa_traditional_cmd='openssl pkey -traditional'
          elif openssl rsa -help 2>&1 | grep -q -- ' -traditional '; then
            rsa_traditional_cmd='openssl rsa -traditional'
          else
            echo "The available OpenSSL build cannot export a traditional RSA key for macOS signing." >&2
            exit 1
          fi
          printf '%s' "$MACOS_SIGNING_P12_BASE64" | base64 -D >"$signing_dir/self-signed.p12"
          openssl pkcs12 \
            ${pkcs12_legacy_flag:+$pkcs12_legacy_flag} \
            -in "$signing_dir/self-signed.p12" \
            -clcerts \
            -nokeys \
            -passin "pass:$MACOS_SIGNING_P12_PASSWORD" |
            openssl x509 -out "$asset_dir/be-music-self-signed-macos.pem"
          openssl pkcs12 \
            ${pkcs12_legacy_flag:+$pkcs12_legacy_flag} \
            -in "$signing_dir/self-signed.p12" \
            -nocerts \
            -nodes \
            -out "$signing_dir/self-signed.key.pem" \
            -passin "pass:$MACOS_SIGNING_P12_PASSWORD"
          $rsa_traditional_cmd \
            -in "$signing_dir/self-signed.key.pem" \
            -out "$signing_dir/self-signed.key.rsa"
          openssl pkcs12 \
            ${pkcs12_legacy_flag:+$pkcs12_legacy_flag} \
            -in "$signing_dir/self-signed.p12" \
            -clcerts \
            -nokeys \
            -out "$signing_dir/self-signed.cert.pem" \
            -passin "pass:$MACOS_SIGNING_P12_PASSWORD"

          certtool i "$signing_dir/self-signed.cert.pem" k="$keychain_path" r="$signing_dir/self-signed.key.rsa" c p="$keychain_password" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          identity="$(security find-certificate -a -Z "$keychain_path" | awk '/SHA-1 hash:/ { print $3; exit }')"
          if [ -z "$identity" ]; then
            echo "Failed to find the imported macOS signing certificate." >&2
            exit 1
          fi

          files=()
          if [ "${{ needs.prepare.outputs.release_player_tui }}" = 'true' ]; then
            files+=(packages/player-tui/dist-sea/be-music-player)
          fi
          if [ "${{ needs.prepare.outputs.release_audio_renderer }}" = 'true' ]; then
            files+=(packages/audio-renderer/dist-sea/be-music-audio-render)
          fi

          for file in "${files[@]}"; do
            codesign --force --sign "$identity" --keychain "$keychain_path" "$file"
            codesign --verify --strict --verbose=2 "$file"
          done

      - name: Package SEA archives (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ steps.meta.outputs.archive_suffix }}"

          mkdir -p tmp/release-assets/player tmp/release-assets/audio-renderer

          if [ "${{ needs.prepare.outputs.release_player_tui }}" = 'true' ]; then
            cp packages/player-tui/dist-sea/be-music-player tmp/release-assets/player/
            chmod +x tmp/release-assets/player/be-music-player
            (
              cd tmp/release-assets/player
              zip -9 -q "../be-music-player-${{ needs.prepare.outputs.player_tui_version }}-${suffix}.zip" be-music-player
            )
          fi

          if [ "${{ needs.prepare.outputs.release_audio_renderer }}" = 'true' ]; then
            cp packages/audio-renderer/dist-sea/be-music-audio-render tmp/release-assets/audio-renderer/
            chmod +x tmp/release-assets/audio-renderer/be-music-audio-render
            (
              cd tmp/release-assets/audio-renderer
              zip -9 -q "../be-music-audio-render-${{ needs.prepare.outputs.audio_renderer_version }}-${suffix}.zip" be-music-audio-render
            )
          fi

      - name: Package SEA archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assetDir = 'tmp/release-assets'

          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          if ('${{ needs.prepare.outputs.release_player_tui }}' -eq 'true') {
            Copy-Item 'packages/player-tui/dist-sea/be-music-player.exe' "$assetDir/be-music-player.exe"
          }
          if ('${{ needs.prepare.outputs.release_audio_renderer }}' -eq 'true') {
            Copy-Item 'packages/audio-renderer/dist-sea/be-music-audio-render.exe' "$assetDir/be-music-audio-render.exe"
          }

      - name: Upload SEA archives
        uses: actions/upload-artifact@v7
        with:
          name: sea-release-assets-${{ steps.meta.outputs.archive_suffix }}
          path: tmp/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish Releases
    needs:
      - prepare
      - sea
    if: always() && needs.prepare.outputs.has_releases == 'true' && (needs.sea.result == 'success' || needs.sea.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout workflow sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare release metadata
        shell: bash
        env:
          RELEASES_JSON: ${{ needs.prepare.outputs.releases_json }}
        run: |
          set -euo pipefail
          mkdir -p tmp/release-assets tmp/release-data
          printf '%s' "$RELEASES_JSON" > tmp/release-data/releases.json

      - name: Download SEA archives
        if: needs.prepare.outputs.has_sea_releases == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: sea-release-assets-*
          merge-multiple: true
          path: tmp/release-assets

      - name: Sign and package Windows SEA archives
        if: needs.prepare.outputs.has_sea_releases == 'true'
        shell: bash
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_SIGNING_PFX_BASE64:-}" ] || [ -z "${WINDOWS_SIGNING_PFX_PASSWORD:-}" ]; then
            echo "WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD secrets must be configured for release signing." >&2
            exit 1
          fi

          if [ "${{ needs.prepare.outputs.release_player_tui }}" = 'true' ] && [ ! -f tmp/release-assets/be-music-player.exe ]; then
            echo "Unsigned Windows SEA executable for player is missing." >&2
            exit 1
          fi
          if [ "${{ needs.prepare.outputs.release_audio_renderer }}" = 'true' ] && [ ! -f tmp/release-assets/be-music-audio-render.exe ]; then
            echo "Unsigned Windows SEA executable for audio-renderer is missing." >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y osslsigncode

          signing_dir="tmp/signing/windows"
          mkdir -p "$signing_dir" "$signing_dir/player" "$signing_dir/audio-renderer"

          printf '%s' "$WINDOWS_SIGNING_PFX_BASE64" | base64 -d >"$signing_dir/self-signed.pfx"
          openssl pkcs12 \
            -in "$signing_dir/self-signed.pfx" \
            -clcerts \
            -nokeys \
            -passin "pass:$WINDOWS_SIGNING_PFX_PASSWORD" |
            openssl x509 -outform DER -out "tmp/release-assets/be-music-self-signed-windows.cer"

          if [ "${{ needs.prepare.outputs.release_player_tui }}" = 'true' ]; then
            osslsigncode sign \
              -pkcs12 "$signing_dir/self-signed.pfx" \
              -pass "$WINDOWS_SIGNING_PFX_PASSWORD" \
              -h sha256 \
              -in tmp/release-assets/be-music-player.exe \
              -out "$signing_dir/player/be-music-player.exe"
            (
              cd "$signing_dir/player"
              zip -9 -q "../../../release-assets/be-music-player-${{ needs.prepare.outputs.player_tui_version }}-windows-x64.zip" be-music-player.exe
            )
          fi

          if [ "${{ needs.prepare.outputs.release_audio_renderer }}" = 'true' ]; then
            osslsigncode sign \
              -pkcs12 "$signing_dir/self-signed.pfx" \
              -pass "$WINDOWS_SIGNING_PFX_PASSWORD" \
              -h sha256 \
              -in tmp/release-assets/be-music-audio-render.exe \
              -out "$signing_dir/audio-renderer/be-music-audio-render.exe"
            (
              cd "$signing_dir/audio-renderer"
              zip -9 -q "../../../release-assets/be-music-audio-render-${{ needs.prepare.outputs.audio_renderer_version }}-windows-x64.zip" be-music-audio-render.exe
            )
          fi

          rm -f tmp/release-assets/be-music-player.exe tmp/release-assets/be-music-audio-render.exe

      - name: Create or update GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TARGET: ${{ needs.prepare.outputs.release_target }}
        run: |
          set -euo pipefail
          pnpm exec tsx --tsconfig tsconfig.typecheck.json scripts/release/create-package-releases.ts \
            --repo "$GITHUB_REPOSITORY" \
            --release-target "$RELEASE_TARGET" \
            --releases-json tmp/release-data/releases.json \
            --assets-dir tmp/release-assets
