name: Desktop

# Packages the desktop app (packages/app-desktop/README.md) on macOS and Windows when it changes, and keeps the
# installers as artifacts to try. They are not signed for distribution yet: the macOS app is signed ad hoc and the
# Windows installer is unsigned.
on:
  pull_request:
    paths:
      - 'packages/app-desktop/**'
      - '.github/workflows/desktop.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: be-music-play-macos
            files: |
              packages/app-desktop/release/*.dmg
              packages/app-desktop/release/*.zip
          - os: windows-latest
            artifact: be-music-play-windows
            files: packages/app-desktop/release/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Package
        working-directory: packages/app-desktop
        run: vp run dist

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
