name: Deploy preview OIDC registration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-devel
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'nulltask/be-music' && github.ref_name == 'fix/supporter-preview-oidc'
    runs-on: ubuntu-24.04-arm
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DASHBOARD_D1_PREVIEW_ID: ${{ secrets.DASHBOARD_D1_PREVIEW_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Build shared utilities
        run: pnpm --filter @be-music/shared-utils build

      - name: Deploy Accounts to preview
        run: pnpm --filter @be-music/app-dashboard run deploy:preview
