name: CI

on:
  push:
    branches:
      - devel
      - main
  # Every pull request, stacked ones included, so a branch that targets another feature branch is verified too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress. Pushes to `devel` / `main` all finish: their
# benchmark comments are the history of each commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      code_changed: ${{ steps.code.outputs.code }}
      bench_changed: ${{ steps.filter.outputs.bench }}
      sea_player_changed: ${{ steps.filter.outputs.sea_player }}
      sea_audio_renderer_changed: ${{ steps.filter.outputs.sea_audio_renderer }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A file counts as code unless it is documentation. The negations need `every`: by default a file matches when
      # any one pattern does, and `'**'` alone matches everything.
      - name: Detect code changes
        id: code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Every package; the scope selector measures the changed ones only (scripts/bench/affected-packages.ts).
            bench:
              - 'packages/**'
              - 'scripts/bench/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            sea_player:
              - 'packages/player-engine/**'
              - 'packages/audio-sample/**'
              - 'packages/chart-audio-renderer/**'
              - 'packages/chart-parser/**'
              - 'packages/chart-source/**'
              - 'packages/shared-utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'
            sea_audio_renderer:
              - 'packages/audio-sample/**'
              - 'packages/chart-audio-renderer/**'
              - 'packages/chart-parser/**'
              - 'packages/chart-source/**'
              - 'packages/shared-utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'

  verify:
    name: Verify (${{ matrix.task }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # `check` runs format, lint, and type checks in one pass from the root Vite+ config.
          - task: check
            run: vp run check
          - task: build
            run: vp run build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.run }}

  coverage-shard:
    name: Test (${{ matrix.shard }}/3)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install
      - name: Run test shard with coverage
        env:
          SHARD: ${{ matrix.shard }}
          BE_MUSIC_COVERAGE_SHARD: '1'
        run: >-
          vp test run --shard="$SHARD/3" --reporter=default --reporter=blob
          --outputFile="tmp/coverage-shard-$SHARD.json" --coverage --coverage.reportOnFailure
      - name: Upload shard data
        if: ${{ !cancelled() && hashFiles('tmp/coverage-shard-*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: tmp/coverage-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Test coverage
    needs: coverage-shard
    if: ${{ !cancelled() && (needs.coverage-shard.result == 'success' || needs.coverage-shard.result == 'failure') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install
      - name: Download shard data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: tmp/coverage-shards
      - name: Merge test and coverage reports
        shell: bash
        run: |
          for shard in 1 2 3; do
            if [ ! -s "tmp/coverage-shards/coverage-shard-$shard.json" ]; then
              echo "::error::Missing coverage data from shard $shard/3"
              exit 1
            fi
          done
          vp test run --merge-reports=tmp/coverage-shards --coverage
      - name: Upload coverage report
        id: report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage
          path: |
            coverage/
            !coverage/lcov-report/**
          if-no-files-found: error
          retention-days: 30
      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        env:
          COVERAGE_ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';

          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          console.log('## Test coverage\n');
          console.log('| Metric | Covered / total | Coverage |');
          console.log('| --- | ---: | ---: |');
          for (const metric of ['lines', 'statements', 'branches', 'functions']) {
            const { covered, total: count, pct } = total[metric];
            console.log(`| ${metric} | ${covered} / ${count} | ${pct}% |`);
          }
          if (process.env.COVERAGE_ARTIFACT_URL) {
            console.log(`\n[Download the HTML and LCOV reports](${process.env.COVERAGE_ARTIFACT_URL}). Extract the archive and open \`index.html\` for file details.`);
          }
          JS

  # Base and head share one VM. Split jobs land on different ubuntu-24.04-arm
  # machines, and that host delta dominates the 8% regression threshold.
  # Per-case time is longer than the local default so tinybench gets enough samples;
  # compare treats the median change as the verdict, not the per-case count.
  # Per-case lists also compare median ops/s (tinybench p50), not mean throughput.
  benchmark-push:
    name: Benchmark (Push)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.bench_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BENCH_TIME_MS: 50
      BENCH_WARMUP_TIME_MS: 25
      BENCH_REPEATS: 5
      BENCH_REGRESSION_THRESHOLD: 8
      BENCH_ISSUE_THRESHOLD: 20
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Select benchmark packages
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > "$RUNNER_TEMP/bench-changed-files"
          else
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/bench-changed-files"
          fi
          packages="$(node --conditions=source scripts/bench/affected-packages.ts < "$RUNNER_TEMP/bench-changed-files")"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ -z "$packages" ]; then
            echo "No benchmarked runtime packages changed; measurement skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmarking $packages: $BENCH_REPEATS paired runs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect benchmark support
        if: steps.scope.outputs.packages != ''
        id: detect-bench
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            # The new main tip is the head. Compare it with main before this push.
            BASE_SHA="$(git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" || true)"
          else
            git fetch --no-tags origin refs/heads/main
            BASE_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          fi
          echo "BENCH_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          BASE_PKG_JSON="$(mktemp)"
          trap 'rm -f "$BASE_PKG_JSON"' EXIT
          if [ -z "$BASE_SHA" ] || ! git show "${BASE_SHA}:package.json" > "$BASE_PKG_JSON" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Benchmark baseline (main): $BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          if node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(pkg.scripts && pkg.scripts['bench'] ? 0 : 1);" "$BASE_PKG_JSON"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.scope.outputs.packages != ''
        run: vp install

      # Head and base take turns (head, base, head, base, …), so a slow stretch on the shared runner slows both sides
      # alike; the comparison then reads each side's run-to-run spread to tell a change from noise.
      - name: Prepare base worktree
        id: prepare-base
        if: steps.scope.outputs.packages != '' && steps.detect-bench.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="${RUNNER_TEMP}/bench-base"
          git worktree add --detach "$BASE_DIR" "$BENCH_BASE_SHA"
          (cd "$BASE_DIR" && pnpm install --frozen-lockfile --prefer-offline)
          echo "dir=$BASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks (interleaved)
        if: steps.scope.outputs.packages != ''
        id: run-bench
        shell: bash
        env:
          BASE_DIR: ${{ steps.prepare-base.outputs.dir }}
          BENCH_PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p tmp/bench/head-runs tmp/bench/base-runs
          base_ok=false
          if [ -n "${BASE_DIR:-}" ]; then base_ok=true; fi
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="${{ github.sha }}" pnpm run bench --output "tmp/bench/head-runs/run-${run_index}.json" --packages "$BENCH_PACKAGES" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
            if [ "$base_ok" = true ]; then
              if ! (cd "$BASE_DIR" && BENCH_GIT_SHA="$BENCH_BASE_SHA" pnpm run bench --output "$GITHUB_WORKSPACE/tmp/bench/base-runs/run-${run_index}.json" --packages "$BENCH_PACKAGES" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"); then
                echo "::warning::The base benchmark failed; the report shows the head only."
                base_ok=false
                rm -f tmp/bench/base-runs/*.json
              fi
            fi
          done
          echo "base_ok=$base_ok" >> "$GITHUB_OUTPUT"

      - name: Aggregate benchmark snapshots
        if: steps.scope.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/head.json tmp/bench/head-runs/*.json
          if [ "${{ steps.run-bench.outputs.base_ok }}" = true ]; then
            pnpm run bench:aggregate -- --output tmp/bench/base.json tmp/bench/base-runs/*.json
          fi

      - name: Generate benchmark report
        if: steps.scope.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          # The benchmarked packages this change touches, listed first in the report.
          CHANGED_PACKAGES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- packages 2>/dev/null | sed -n 's#^packages/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, - || true)"
          args=(--head tmp/bench/head.json --output tmp/bench/push-benchmark.md --summary tmp/bench/push-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12 --repository-url "${{ github.server_url }}/${{ github.repository }}" --changed-packages "$CHANGED_PACKAGES")
          if [ -f tmp/bench/base.json ]; then
            args+=(--base tmp/bench/base.json)
          fi
          pnpm run bench:compare "${args[@]}"

      - name: Post benchmark comment
        id: benchmark-comment
        if: steps.scope.outputs.packages != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const marker = '<!-- be-music-exports-benchmark -->';
            const body = fs.readFileSync('tmp/bench/push-benchmark.md', 'utf8').trim();
            const commit_sha = context.sha;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.repos.listCommentsForCommit, {
              owner,
              repo,
              commit_sha,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return (
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
            });

            if (existing) {
              const { data } = await github.rest.repos.updateCommitComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.setOutput('url', data.html_url);
            } else {
              const { data } = await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha,
                body,
              });
              core.setOutput('url', data.html_url);
            }

      - name: Confirm benchmark regressions
        id: confirm-regressions
        if: github.ref == 'refs/heads/devel' && steps.run-bench.outputs.base_ok == 'true'
        shell: bash
        env:
          BASE_DIR: ${{ steps.prepare-base.outputs.dir }}
        run: |
          set -euo pipefail
          args=("$BENCH_ISSUE_THRESHOLD" tmp/bench/base.json tmp/bench/head.json)
          candidates="$(node scripts/bench/regressions.ts "${args[@]}")"
          keys="$(jq -r 'map(.key) | join(",")' <<< "$candidates")"
          if [ -z "$keys" ]; then exit 0; fi
          packages="$(jq -r 'map(.key | split(".")[0]) | unique | join(",")' <<< "$candidates")"
          echo "Confirming $(jq length <<< "$candidates") benchmark cases."
          benchmark_args=(--packages "$packages" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS")
          base_runner=scripts/bench/exports.ts
          base_args=("${benchmark_args[@]}")
          base_help="$(cd "$BASE_DIR" && node --conditions=source "$base_runner" --help)"
          if [[ "$base_help" == *--case-keys* ]]; then
            base_args+=(--case-keys "$keys")
          else
            base_runner="$(node scripts/bench/legacy-case-runner.ts "$BASE_DIR" "$keys")"
          fi
          mkdir -p tmp/bench/confirm-head-runs tmp/bench/confirm-base-runs
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="$GITHUB_SHA" pnpm run bench --output "tmp/bench/confirm-head-runs/run-${run_index}.json" "${benchmark_args[@]}" --case-keys "$keys"
            (cd "$BASE_DIR" && BENCH_GIT_SHA="$BENCH_BASE_SHA" node --conditions=source "$base_runner" --output "$GITHUB_WORKSPACE/tmp/bench/confirm-base-runs/run-${run_index}.json" "${base_args[@]}")
          done
          pnpm run bench:aggregate -- --output tmp/bench/confirm-head.json tmp/bench/confirm-head-runs/*.json
          pnpm run bench:aggregate -- --output tmp/bench/confirm-base.json tmp/bench/confirm-base-runs/*.json
          node scripts/bench/regressions.ts "${args[@]}" tmp/bench/confirm-base.json tmp/bench/confirm-head.json > tmp/bench/confirmed-regressions.json
          echo "count=$(jq length tmp/bench/confirmed-regressions.json)" >> "$GITHUB_OUTPUT"

      - name: File confirmed benchmark regressions
        if: steps.confirm-regressions.outputs.count != '' && steps.confirm-regressions.outputs.count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BENCH_REPORT_URL: ${{ steps.benchmark-comment.outputs.url }}
        with:
          script: |
            const fs = require('node:fs');
            const { setTimeout: delay } = require('node:timers/promises');
            const rows = JSON.parse(fs.readFileSync('tmp/bench/confirmed-regressions.json', 'utf8'));
            const base = process.env.BENCH_BASE_SHA;
            const head = context.sha;
            const { owner, repo } = context.repo;
            const repository = `${context.serverUrl}/${owner}/${repo}`;
            const summaryStart = '<!-- be-music-benchmark-summary:start -->';
            const summaryEnd = '<!-- be-music-benchmark-summary:end -->';
            const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
            const percent = (row) => `${(-row.deltaPercent).toFixed(1)}%`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const tracked = issues.filter((item) => !item.pull_request && item.user?.login === 'github-actions[bot]');
            let wroteIssue = false;
            for (const row of rows) {
              const marker = `<!-- be-music-benchmark-case:${encodeURIComponent(row.key)} -->`;
              const issue = tracked.find((item) => item.body?.includes(marker));
              const currentBody = issue?.body ?? '';
              const start = currentBody.indexOf(summaryStart);
              const end = start === -1 ? -1 : currentBody.indexOf(summaryEnd, start);
              const previousSummary = end === -1 ? '' : currentBody.slice(start, end);
              const previousRun = /<!-- be-music-benchmark-run:(\d+) -->/.exec(previousSummary)?.[1];
              if (previousRun !== undefined && Number(previousRun) > runNumber) continue;

              const summary = [
                summaryStart,
                `<!-- be-music-benchmark-run:${runNumber} -->`,
                '## Latest confirmed regression',
                '',
                `\`${row.key}\` lost at least ${process.env.BENCH_ISSUE_THRESHOLD}% throughput on [devel \`${head.slice(0, 8)}\`](${repository}/commit/${head}) compared with [main \`${base.slice(0, 8)}\`](${repository}/commit/${base}) in both measurement rounds. Each round alternated between the same commits on one runner, with ${process.env.BENCH_REPEATS} runs per commit and no overlap between their ranges.`,
                '',
                '| Initial ops/s loss | Confirmed ops/s loss |',
                '| ---: | ---: |',
                `| ${percent(row.initial)} | ${percent(row.confirmation)} |`,
                '',
                `[Benchmark report](${process.env.BENCH_REPORT_URL}) · [Workflow run](${repository}/actions/runs/${context.runId})`,
                summaryEnd,
              ].join('\n');
              const body = end === -1
                ? [currentBody || marker, summary].join('\n\n')
                : currentBody.slice(0, start) + summary + currentBody.slice(end + summaryEnd.length);
              if (body === currentBody) continue;

              // Space out issue writes when a single run confirms many cases.
              if (wroteIssue) await delay(1000);
              if (issue) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              } else {
                await github.rest.issues.create({
                  owner, repo, labels: ['perf'],
                  title: `Performance regression in ${row.key}`,
                  body,
                });
              }
              wroteIssue = true;
            }

  # The release builds the SEA binaries on these three runners (release.yml), and its install runs every package's
  # `prepare` there, so a release pull request (and a manual run) installs on each of them first. The bundles are
  # checked only when their sources changed.
  sea:
    name: SEA (${{ matrix.os }})
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Verify player SEA bundle
        if: needs.changes.outputs.sea_player_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package player --bundle-only

      - name: Verify audio-renderer SEA bundle
        if: needs.changes.outputs.sea_audio_renderer_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package audio-renderer --bundle-only
