name: CI

on:
  push:
    branches:
      - devel
      - main
  # Every pull request, stacked ones included, so a branch that targets another feature branch is verified too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress. Pushes to `devel` / `main` all finish: their
# benchmark comments are the history of each commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      code_changed: ${{ steps.code.outputs.code }}
      bench_changed: ${{ steps.filter.outputs.bench }}
      sea_player_changed: ${{ steps.filter.outputs.sea_player }}
      sea_audio_renderer_changed: ${{ steps.filter.outputs.sea_audio_renderer }}
      native_changed: ${{ steps.filter.outputs.native }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A file counts as code unless it is documentation. The negations need `every`: by default a file matches when
      # any one pattern does, and `'**'` alone matches everything.
      - name: Detect code changes
        id: code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # The packages scripts/bench measures (PACKAGE_NAMES in scripts/bench/exports.types.ts) and the bench itself.
            bench:
              - 'packages/utils/**'
              - 'packages/json/**'
              - 'packages/chart/**'
              - 'packages/parser/**'
              - 'packages/stringifier/**'
              - 'packages/editor/**'
              - 'packages/audio-renderer/**'
              - 'packages/player/**'
              - 'packages/player-tui/**'
              - 'packages/lr2-skin/**'
              - 'packages/skin-sdk/**'
              - 'packages/player-web/**'
              - 'scripts/bench/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.github/workflows/ci.yml'
            # The C port of the fingerprint, and the TypeScript it mirrors.
            native:
              - 'packages/fingerprint-c/**'
              - 'packages/chart/src/fingerprint-rational.ts'
              - '.github/workflows/ci.yml'
            sea_player:
              - 'packages/player/**'
              - 'packages/audio-renderer/**'
              - 'packages/parser/**'
              - 'packages/json/**'
              - 'packages/utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'
            sea_audio_renderer:
              - 'packages/audio-renderer/**'
              - 'packages/parser/**'
              - 'packages/json/**'
              - 'packages/utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'

  native:
    name: Native (${{ matrix.name }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.native_changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            run: make -C packages/fingerprint-c test std sanitize CC=gcc CXX=g++
          - name: linux-clang-wasm
            os: ubuntu-24.04
            setup: sudo apt-get update && sudo apt-get install -y lld
            run: make -C packages/fingerprint-c test std sanitize wasm CC=clang CXX=clang++ WASM_CC=clang
          - name: linux-32bit
            os: ubuntu-24.04
            setup: sudo apt-get update && sudo apt-get install -y gcc-multilib
            run: make -C packages/fingerprint-c test CC="gcc -m32"
          - name: macos-clang
            os: macos-15
            run: make -C packages/fingerprint-c test std sanitize

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        if: matrix.setup
        run: ${{ matrix.setup }}

      - name: Build and test
        run: ${{ matrix.run }}

  native-msvc:
    name: Native (windows-msvc)
    needs: changes
    if: github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.native_changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build and test
        shell: cmd
        working-directory: packages/fingerprint-c
        run: |
          cl /nologo /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /Iinclude /Isrc tests\test_main.c src\context.c src\bigint.c src\rational.c src\binary64.c src\sha256.c src\bmfp.c src\alloc_libc.c /Fe:bmfp-test.exe || exit /b 1
          bmfp-test.exe tests\vectors

  verify:
    name: Verify (${{ matrix.task }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task:
          # `check` runs format, lint, and type checks in one pass from the root Vite+ config.
          - check
          - build
          - test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Run ${{ matrix.task }}
        run: vp run ${{ matrix.task }}

  # Base and head share one VM. Split jobs land on different ubuntu-24.04-arm
  # machines, and that host delta dominates the 8% regression threshold.
  # Per-case time is longer than the local default so tinybench gets enough samples;
  # compare treats the median change as the verdict, not the per-case count.
  # Per-case lists also compare median ops/s (tinybench p50), not mean throughput.
  benchmark-pr:
    name: Benchmark (PR)
    needs: changes
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
      (github.base_ref == 'devel' || github.base_ref == 'main') &&
      needs.changes.outputs.bench_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BENCH_TIME_MS: 50
      BENCH_WARMUP_TIME_MS: 25
      BENCH_REPEATS: 5
      BENCH_REGRESSION_THRESHOLD: 8
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Detect benchmark support
        id: detect-bench
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_PKG_JSON="$(mktemp)"
          trap 'rm -f "$BASE_PKG_JSON"' EXIT
          if ! git show "${BASE_SHA}:package.json" > "$BASE_PKG_JSON" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(pkg.scripts && pkg.scripts['bench'] ? 0 : 1);" "$BASE_PKG_JSON"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: vp install

      # Head and base take turns (head, base, head, base, …), so a slow stretch on the shared runner slows both sides
      # alike; the comparison then reads each side's run-to-run spread to tell a change from noise.
      - name: Prepare base worktree
        id: prepare-base
        if: steps.detect-bench.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="${RUNNER_TEMP}/bench-base"
          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          (cd "$BASE_DIR" && pnpm install --frozen-lockfile --prefer-offline)
          echo "dir=$BASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks (interleaved)
        id: run-bench
        shell: bash
        env:
          BASE_DIR: ${{ steps.prepare-base.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p tmp/bench/head-runs tmp/bench/base-runs
          base_ok=false
          if [ -n "${BASE_DIR:-}" ]; then base_ok=true; fi
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="${{ github.event.pull_request.head.sha }}" pnpm run bench --output "tmp/bench/head-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
            if [ "$base_ok" = true ]; then
              if ! (cd "$BASE_DIR" && BENCH_GIT_SHA="${{ github.event.pull_request.base.sha }}" pnpm run bench --output "$GITHUB_WORKSPACE/tmp/bench/base-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"); then
                echo "::warning::The base benchmark failed; the report shows the head only."
                base_ok=false
                rm -f tmp/bench/base-runs/*.json
              fi
            fi
          done
          echo "base_ok=$base_ok" >> "$GITHUB_OUTPUT"

      - name: Aggregate benchmark snapshots
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/head.json tmp/bench/head-runs/*.json
          if [ "${{ steps.run-bench.outputs.base_ok }}" = true ]; then
            pnpm run bench:aggregate -- --output tmp/bench/base.json tmp/bench/base-runs/*.json
          fi

      - name: Generate benchmark report
        shell: bash
        run: |
          set -euo pipefail
          # The benchmarked packages this change touches, listed first in the report.
          CHANGED_PACKAGES="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- packages 2>/dev/null | sed -n 's#^packages/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, - || true)"
          args=(--head tmp/bench/head.json --output tmp/bench/pr-benchmark.md --summary tmp/bench/pr-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12 --repository-url "${{ github.server_url }}/${{ github.repository }}" --changed-packages "$CHANGED_PACKAGES")
          if [ -f tmp/bench/base.json ]; then
            args+=(--base tmp/bench/base.json)
          fi
          pnpm run bench:compare "${args[@]}"

      - name: Post benchmark comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const marker = '<!-- be-music-exports-benchmark -->';
            const body = fs.readFileSync('tmp/bench/pr-benchmark.md', 'utf8').trim();
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return (
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  # Same-VM pairing as benchmark-pr; do not split base/head across jobs.
  benchmark-push:
    name: Benchmark (Push)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.bench_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BENCH_TIME_MS: 50
      BENCH_WARMUP_TIME_MS: 25
      BENCH_REPEATS: 5
      BENCH_REGRESSION_THRESHOLD: 8
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Detect benchmark support
        id: detect-bench
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_PKG_JSON="$(mktemp)"
          trap 'rm -f "$BASE_PKG_JSON"' EXIT
          if ! git show "${BASE_SHA}:package.json" > "$BASE_PKG_JSON" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(pkg.scripts && pkg.scripts['bench'] ? 0 : 1);" "$BASE_PKG_JSON"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: vp install

      # Head and base take turns (head, base, head, base, …), so a slow stretch on the shared runner slows both sides
      # alike; the comparison then reads each side's run-to-run spread to tell a change from noise.
      - name: Prepare base worktree
        id: prepare-base
        if: steps.detect-bench.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="${RUNNER_TEMP}/bench-base"
          git worktree add --detach "$BASE_DIR" "${{ github.event.before }}"
          (cd "$BASE_DIR" && pnpm install --frozen-lockfile --prefer-offline)
          echo "dir=$BASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks (interleaved)
        id: run-bench
        shell: bash
        env:
          BASE_DIR: ${{ steps.prepare-base.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p tmp/bench/head-runs tmp/bench/base-runs
          base_ok=false
          if [ -n "${BASE_DIR:-}" ]; then base_ok=true; fi
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="${{ github.sha }}" pnpm run bench --output "tmp/bench/head-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
            if [ "$base_ok" = true ]; then
              if ! (cd "$BASE_DIR" && BENCH_GIT_SHA="${{ github.event.before }}" pnpm run bench --output "$GITHUB_WORKSPACE/tmp/bench/base-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"); then
                echo "::warning::The base benchmark failed; the report shows the head only."
                base_ok=false
                rm -f tmp/bench/base-runs/*.json
              fi
            fi
          done
          echo "base_ok=$base_ok" >> "$GITHUB_OUTPUT"

      - name: Aggregate benchmark snapshots
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/head.json tmp/bench/head-runs/*.json
          if [ "${{ steps.run-bench.outputs.base_ok }}" = true ]; then
            pnpm run bench:aggregate -- --output tmp/bench/base.json tmp/bench/base-runs/*.json
          fi

      - name: Generate benchmark report
        shell: bash
        run: |
          set -euo pipefail
          # The benchmarked packages this change touches, listed first in the report.
          CHANGED_PACKAGES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- packages 2>/dev/null | sed -n 's#^packages/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, - || true)"
          args=(--head tmp/bench/head.json --output tmp/bench/push-benchmark.md --summary tmp/bench/push-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12 --repository-url "${{ github.server_url }}/${{ github.repository }}" --changed-packages "$CHANGED_PACKAGES")
          if [ -f tmp/bench/base.json ]; then
            args+=(--base tmp/bench/base.json)
          fi
          pnpm run bench:compare "${args[@]}"

      - name: Post benchmark comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const marker = '<!-- be-music-exports-benchmark -->';
            const body = fs.readFileSync('tmp/bench/push-benchmark.md', 'utf8').trim();
            const commit_sha = context.sha;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.repos.listCommentsForCommit, {
              owner,
              repo,
              commit_sha,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return (
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
            });

            if (existing) {
              await github.rest.repos.updateCommitComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha,
                body,
              });
            }

  sea:
    name: SEA
    needs: changes
    if: |
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.base_ref == 'main')
      ) &&
      (
        needs.changes.outputs.sea_player_changed == 'true' ||
        needs.changes.outputs.sea_audio_renderer_changed == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Verify player SEA bundle
        if: needs.changes.outputs.sea_player_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package player --bundle-only

      - name: Verify audio-renderer SEA bundle
        if: needs.changes.outputs.sea_audio_renderer_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package audio-renderer --bundle-only
