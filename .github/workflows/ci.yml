name: CI

on:
  push:
    branches:
      - devel
      - main
  pull_request:
    branches:
      - devel
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
      sea_player_changed: ${{ steps.filter.outputs.sea_player }}
      sea_audio_renderer_changed: ${{ steps.filter.outputs.sea_audio_renderer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            sea_player:
              - 'packages/player/**'
              - 'packages/audio-renderer/**'
              - 'packages/parser/**'
              - 'packages/json/**'
              - 'packages/utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'
            sea_audio_renderer:
              - 'packages/audio-renderer/**'
              - 'packages/parser/**'
              - 'packages/json/**'
              - 'packages/utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'

  verify:
    name: Verify (${{ matrix.task }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - typecheck
          - build
          - test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run ${{ matrix.task }}
        run: pnpm run ${{ matrix.task }}

  # Base and head share one VM. Split jobs land on different ubuntu-24.04-arm
  # machines, and that host delta dominates the 8% regression threshold.
  # Per-case time is longer than the local default so tinybench gets enough samples;
  # compare treats the median change as the verdict, not the per-case count.
  # Per-case lists also compare median ops/s (tinybench p50), not mean throughput.
  benchmark-pr:
    name: Benchmark (PR)
    needs: changes
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BENCH_TIME_MS: 50
      BENCH_WARMUP_TIME_MS: 25
      BENCH_REPEATS: 3
      BENCH_REGRESSION_THRESHOLD: 8
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Detect benchmark support
        id: detect-bench
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_PKG_JSON="$(mktemp)"
          trap 'rm -f "$BASE_PKG_JSON"' EXIT
          if ! git show "${BASE_SHA}:package.json" > "$BASE_PKG_JSON" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(pkg.scripts && pkg.scripts['bench'] ? 0 : 1);" "$BASE_PKG_JSON"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run head benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/bench/head-runs
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="${{ github.event.pull_request.head.sha }}" pnpm run bench --output "tmp/bench/head-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
          done

      - name: Aggregate head benchmark snapshots
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/head.json tmp/bench/head-runs/*.json

      - name: Run base benchmark
        id: run-base-benchmark
        if: steps.detect-bench.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_DIR="$(mktemp -d)"

          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
            rm -rf "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          mkdir -p tmp/bench/base-runs

          (
            cd "$BASE_DIR"
            pnpm install --frozen-lockfile --prefer-offline
            for run_index in $(seq 1 "$BENCH_REPEATS"); do
              BENCH_GIT_SHA="$BASE_SHA" pnpm run bench --output "tmp/bench/base-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
            done
          )

          cp "$BASE_DIR"/tmp/bench/base-runs/*.json tmp/bench/base-runs/

      - name: Aggregate base benchmark snapshots
        if: steps.detect-bench.outputs.available == 'true' &&
          steps.run-base-benchmark.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/base.json tmp/bench/base-runs/*.json

      - name: Generate benchmark report
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tmp/bench/base.json ]; then
            pnpm run bench:compare --head tmp/bench/head.json --base tmp/bench/base.json --output tmp/bench/pr-benchmark.md --summary tmp/bench/pr-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12
          else
            pnpm run bench:compare --head tmp/bench/head.json --output tmp/bench/pr-benchmark.md --summary tmp/bench/pr-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12
          fi

      - name: Post benchmark comment
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const marker = '<!-- be-music-exports-benchmark -->';
            const body = fs.readFileSync('tmp/bench/pr-benchmark.md', 'utf8').trim();
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return (
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  # Same-VM pairing as benchmark-pr; do not split base/head across jobs.
  benchmark-push:
    name: Benchmark (Push)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BENCH_TIME_MS: 50
      BENCH_WARMUP_TIME_MS: 25
      BENCH_REPEATS: 3
      BENCH_REGRESSION_THRESHOLD: 8
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Detect benchmark support
        id: detect-bench
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_PKG_JSON="$(mktemp)"
          trap 'rm -f "$BASE_PKG_JSON"' EXIT
          if ! git show "${BASE_SHA}:package.json" > "$BASE_PKG_JSON" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(pkg.scripts && pkg.scripts['bench'] ? 0 : 1);" "$BASE_PKG_JSON"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run head benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/bench/head-runs
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="${{ github.sha }}" pnpm run bench --output "tmp/bench/head-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
          done

      - name: Aggregate head benchmark snapshots
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/head.json tmp/bench/head-runs/*.json

      - name: Run base benchmark
        id: run-base-benchmark
        if: steps.detect-bench.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          BASE_DIR="$(mktemp -d)"

          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
            rm -rf "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          mkdir -p tmp/bench/base-runs

          (
            cd "$BASE_DIR"
            pnpm install --frozen-lockfile --prefer-offline
            for run_index in $(seq 1 "$BENCH_REPEATS"); do
              BENCH_GIT_SHA="$BASE_SHA" pnpm run bench --output "tmp/bench/base-runs/run-${run_index}.json" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
            done
          )

          cp "$BASE_DIR"/tmp/bench/base-runs/*.json tmp/bench/base-runs/

      - name: Aggregate base benchmark snapshots
        if: steps.detect-bench.outputs.available == 'true' &&
          steps.run-base-benchmark.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/base.json tmp/bench/base-runs/*.json

      - name: Generate benchmark report
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tmp/bench/base.json ]; then
            pnpm run bench:compare --head tmp/bench/head.json --base tmp/bench/base.json --output tmp/bench/push-benchmark.md --summary tmp/bench/push-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12
          else
            pnpm run bench:compare --head tmp/bench/head.json --output tmp/bench/push-benchmark.md --summary tmp/bench/push-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12
          fi

      - name: Post benchmark comment
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const marker = '<!-- be-music-exports-benchmark -->';
            const body = fs.readFileSync('tmp/bench/push-benchmark.md', 'utf8').trim();
            const commit_sha = context.sha;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.repos.listCommentsForCommit, {
              owner,
              repo,
              commit_sha,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return (
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
            });

            if (existing) {
              await github.rest.repos.updateCommitComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha,
                body,
              });
            }

  sea:
    name: SEA
    needs: changes
    if: |
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.base_ref == 'main')
      ) &&
      (
        needs.changes.outputs.sea_player_changed == 'true' ||
        needs.changes.outputs.sea_audio_renderer_changed == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify player SEA bundle
        if: needs.changes.outputs.sea_player_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package player --bundle-only

      - name: Verify audio-renderer SEA bundle
        if: needs.changes.outputs.sea_audio_renderer_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package audio-renderer --bundle-only
