name: CI

on:
  push:
    branches:
      - devel
      - main
  # Every pull request, stacked ones included, so a branch that targets another feature branch is verified too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress. Pushes to `devel` / `main` all finish: their
# benchmark comments are the history of each commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      code_changed: ${{ steps.code.outputs.code }}
      bench_changed: ${{ steps.filter.outputs.bench }}
      sea_player_changed: ${{ steps.filter.outputs.sea_player }}
      sea_audio_renderer_changed: ${{ steps.filter.outputs.sea_audio_renderer }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A file counts as code unless it is documentation. The negations need `every`: by default a file matches when
      # any one pattern does, and `'**'` alone matches everything.
      - name: Detect code changes
        id: code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Include unmeasured intermediaries too; the scope selector follows their benchmarked dependents.
            bench:
              - 'packages/**'
              - 'scripts/bench/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            sea_player:
              - 'packages/player-engine/**'
              - 'packages/chart-audio-renderer/**'
              - 'packages/chart-parser/**'
              - 'packages/chart-source/**'
              - 'packages/shared-utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'
            sea_audio_renderer:
              - 'packages/chart-audio-renderer/**'
              - 'packages/chart-parser/**'
              - 'packages/chart-source/**'
              - 'packages/shared-utils/**'
              - 'scripts/build-sea.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.node-version'
              - 'tsconfig*.json'
              - 'packages/*/tsconfig*.json'

  verify:
    name: Verify (${{ matrix.task }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task:
          # `check` runs format, lint, and type checks in one pass from the root Vite+ config.
          - check
          - build
          - test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Run ${{ matrix.task }}
        run: vp run ${{ matrix.task }}

  # Base and head share one VM. Split jobs land on different ubuntu-24.04-arm
  # machines, and that host delta dominates the 8% regression threshold.
  # Per-case time is longer than the local default so tinybench gets enough samples;
  # compare treats the median change as the verdict, not the per-case count.
  # Per-case lists also compare median ops/s (tinybench p50), not mean throughput.
  benchmark-pr:
    name: Benchmark (PR)
    needs: changes
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
      (github.base_ref == 'devel' || github.base_ref == 'main') &&
      needs.changes.outputs.bench_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BENCH_TIME_MS: 50
      BENCH_WARMUP_TIME_MS: 25
      BENCH_REPEATS: 3
      BENCH_REGRESSION_THRESHOLD: 8
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Select benchmark packages
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > "$RUNNER_TEMP/bench-changed-files"
          else
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/bench-changed-files"
          fi
          packages="$(node --conditions=source scripts/bench/affected-packages.ts < "$RUNNER_TEMP/bench-changed-files")"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ -z "$packages" ]; then
            echo "No benchmarked runtime packages changed; measurement skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmarking $packages: 3 paired runs per revision." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect benchmark support
        if: steps.scope.outputs.packages != ''
        id: detect-bench
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_PKG_JSON="$(mktemp)"
          trap 'rm -f "$BASE_PKG_JSON"' EXIT
          if ! git show "${BASE_SHA}:package.json" > "$BASE_PKG_JSON" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(pkg.scripts && pkg.scripts['bench'] ? 0 : 1);" "$BASE_PKG_JSON"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.scope.outputs.packages != ''
        run: vp install

      # Head and base take turns (head, base, head, base, …), so a slow stretch on the shared runner slows both sides
      # alike; the comparison then reads each side's run-to-run spread to tell a change from noise.
      - name: Prepare base worktree
        id: prepare-base
        if: steps.scope.outputs.packages != '' && steps.detect-bench.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="${RUNNER_TEMP}/bench-base"
          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          (cd "$BASE_DIR" && pnpm install --frozen-lockfile --prefer-offline)
          echo "dir=$BASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks (interleaved)
        if: steps.scope.outputs.packages != ''
        id: run-bench
        shell: bash
        env:
          BASE_DIR: ${{ steps.prepare-base.outputs.dir }}
          BENCH_PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p tmp/bench/head-runs tmp/bench/base-runs
          base_ok=false
          if [ -n "${BASE_DIR:-}" ]; then base_ok=true; fi
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="${{ github.event.pull_request.head.sha }}" pnpm run bench --output "tmp/bench/head-runs/run-${run_index}.json" --packages "$BENCH_PACKAGES" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
            if [ "$base_ok" = true ]; then
              if ! (cd "$BASE_DIR" && BENCH_GIT_SHA="${{ github.event.pull_request.base.sha }}" pnpm run bench --output "$GITHUB_WORKSPACE/tmp/bench/base-runs/run-${run_index}.json" --packages "$BENCH_PACKAGES" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"); then
                echo "::warning::The base benchmark failed; the report shows the head only."
                base_ok=false
                rm -f tmp/bench/base-runs/*.json
              fi
            fi
          done
          echo "base_ok=$base_ok" >> "$GITHUB_OUTPUT"

      - name: Aggregate benchmark snapshots
        if: steps.scope.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/head.json tmp/bench/head-runs/*.json
          if [ "${{ steps.run-bench.outputs.base_ok }}" = true ]; then
            pnpm run bench:aggregate -- --output tmp/bench/base.json tmp/bench/base-runs/*.json
          fi

      - name: Generate benchmark report
        if: steps.scope.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          # The benchmarked packages this change touches, listed first in the report.
          CHANGED_PACKAGES="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- packages 2>/dev/null | sed -n 's#^packages/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, - || true)"
          args=(--head tmp/bench/head.json --output tmp/bench/pr-benchmark.md --summary tmp/bench/pr-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12 --repository-url "${{ github.server_url }}/${{ github.repository }}" --changed-packages "$CHANGED_PACKAGES")
          if [ -f tmp/bench/base.json ]; then
            args+=(--base tmp/bench/base.json)
          fi
          pnpm run bench:compare "${args[@]}"

      - name: Post benchmark comment
        if: steps.scope.outputs.packages != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const marker = '<!-- be-music-exports-benchmark -->';
            const body = fs.readFileSync('tmp/bench/pr-benchmark.md', 'utf8').trim();
            const issue_number = context.issue.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return (
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  # Same-VM pairing as benchmark-pr; do not split base/head across jobs.
  benchmark-push:
    name: Benchmark (Push)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.bench_changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      BENCH_TIME_MS: 50
      BENCH_WARMUP_TIME_MS: 25
      BENCH_REPEATS: 3
      BENCH_REGRESSION_THRESHOLD: 8
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Select benchmark packages
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > "$RUNNER_TEMP/bench-changed-files"
          else
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/bench-changed-files"
          fi
          packages="$(node --conditions=source scripts/bench/affected-packages.ts < "$RUNNER_TEMP/bench-changed-files")"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          if [ -z "$packages" ]; then
            echo "No benchmarked runtime packages changed; measurement skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmarking $packages: 3 paired runs per revision." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect benchmark support
        if: steps.scope.outputs.packages != ''
        id: detect-bench
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_PKG_JSON="$(mktemp)"
          trap 'rm -f "$BASE_PKG_JSON"' EXIT
          if ! git show "${BASE_SHA}:package.json" > "$BASE_PKG_JSON" 2>/dev/null; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.exit(pkg.scripts && pkg.scripts['bench'] ? 0 : 1);" "$BASE_PKG_JSON"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.scope.outputs.packages != ''
        run: vp install

      # Head and base take turns (head, base, head, base, …), so a slow stretch on the shared runner slows both sides
      # alike; the comparison then reads each side's run-to-run spread to tell a change from noise.
      - name: Prepare base worktree
        id: prepare-base
        if: steps.scope.outputs.packages != '' && steps.detect-bench.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="${RUNNER_TEMP}/bench-base"
          git worktree add --detach "$BASE_DIR" "${{ github.event.before }}"
          (cd "$BASE_DIR" && pnpm install --frozen-lockfile --prefer-offline)
          echo "dir=$BASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Run benchmarks (interleaved)
        if: steps.scope.outputs.packages != ''
        id: run-bench
        shell: bash
        env:
          BASE_DIR: ${{ steps.prepare-base.outputs.dir }}
          BENCH_PACKAGES: ${{ steps.scope.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p tmp/bench/head-runs tmp/bench/base-runs
          base_ok=false
          if [ -n "${BASE_DIR:-}" ]; then base_ok=true; fi
          for run_index in $(seq 1 "$BENCH_REPEATS"); do
            BENCH_GIT_SHA="${{ github.sha }}" pnpm run bench --output "tmp/bench/head-runs/run-${run_index}.json" --packages "$BENCH_PACKAGES" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"
            if [ "$base_ok" = true ]; then
              if ! (cd "$BASE_DIR" && BENCH_GIT_SHA="${{ github.event.before }}" pnpm run bench --output "$GITHUB_WORKSPACE/tmp/bench/base-runs/run-${run_index}.json" --packages "$BENCH_PACKAGES" --time "$BENCH_TIME_MS" --warmup-time "$BENCH_WARMUP_TIME_MS"); then
                echo "::warning::The base benchmark failed; the report shows the head only."
                base_ok=false
                rm -f tmp/bench/base-runs/*.json
              fi
            fi
          done
          echo "base_ok=$base_ok" >> "$GITHUB_OUTPUT"

      - name: Aggregate benchmark snapshots
        if: steps.scope.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          pnpm run bench:aggregate -- --output tmp/bench/head.json tmp/bench/head-runs/*.json
          if [ "${{ steps.run-bench.outputs.base_ok }}" = true ]; then
            pnpm run bench:aggregate -- --output tmp/bench/base.json tmp/bench/base-runs/*.json
          fi

      - name: Generate benchmark report
        if: steps.scope.outputs.packages != ''
        shell: bash
        run: |
          set -euo pipefail
          # The benchmarked packages this change touches, listed first in the report.
          CHANGED_PACKAGES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- packages 2>/dev/null | sed -n 's#^packages/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, - || true)"
          args=(--head tmp/bench/head.json --output tmp/bench/push-benchmark.md --summary tmp/bench/push-benchmark-summary.json --threshold "$BENCH_REGRESSION_THRESHOLD" --top 12 --repository-url "${{ github.server_url }}/${{ github.repository }}" --changed-packages "$CHANGED_PACKAGES")
          if [ -f tmp/bench/base.json ]; then
            args+=(--base tmp/bench/base.json)
          fi
          pnpm run bench:compare "${args[@]}"

      - name: Post benchmark comment
        if: steps.scope.outputs.packages != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const marker = '<!-- be-music-exports-benchmark -->';
            const body = fs.readFileSync('tmp/bench/push-benchmark.md', 'utf8').trim();
            const commit_sha = context.sha;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.repos.listCommentsForCommit, {
              owner,
              repo,
              commit_sha,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return (
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
              );
            });

            if (existing) {
              await github.rest.repos.updateCommitComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha,
                body,
              });
            }

  # The release builds the SEA binaries on these three runners (release.yml), and its install runs every package's
  # `prepare` there, so a release pull request (and a manual run) installs on each of them first. The bundles are
  # checked only when their sources changed.
  sea:
    name: SEA (${{ matrix.os }})
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Verify player SEA bundle
        if: needs.changes.outputs.sea_player_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package player --bundle-only

      - name: Verify audio-renderer SEA bundle
        if: needs.changes.outputs.sea_audio_renderer_changed == 'true'
        run: node --conditions=source scripts/build-sea.ts --package audio-renderer --bundle-only
