name: E2E

# The Playwright suite in `packages/app-play/e2e` (docs/course-checklist.md, "Automated run"). A pull request that
# touches the player gets the smoke run, the tests tagged `@smoke`; every night `devel` gets the whole suite.
on:
  pull_request:
  schedule:
    # 03:00 JST.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Tests to run
        type: choice
        options:
          - full
          - smoke
        default: full

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    outputs:
      player: ${{ steps.filter.outputs.player }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The player app and every workspace package it bundles, with the build and fixture inputs. Markdown is left out.
      - name: Detect player changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            player:
              - '{packages/{app-play,player-browser,player-engine,player-ui,player-scene-model,player-skin-sdk,skin-lr2,skin-beatoraja,chart-model,chart-parser,chart-source,shared-utils,service-web-theme}/**,scripts/course-checklist/**,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,.node-version,vite.config.ts,tsconfig*.json,.github/workflows/e2e.yml}'
              - '!**/*.md'

  e2e:
    name: E2E (${{ github.event_name == 'pull_request' && 'smoke' || inputs.scope || 'full' }})
    needs: changes
    # `changes` is skipped outside pull requests; run regardless of that, but only on a player change in a pull request.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.player == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 90 }}
    env:
      CI: 'true'
      E2E_WORKERS: 4
      E2E_GREP: ${{ (github.event_name == 'pull_request' || inputs.scope == 'smoke') && '@smoke' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs vp (version from the `vite-plus` catalog entry), the `.node-version` runtime, and managed
      # `pnpm`, and caches the package store.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$E2E_GREP" ]; then
            pnpm run test:e2e --grep "$E2E_GREP"
          else
            pnpm run test:e2e
          fi

      - name: Upload report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            packages/app-play/e2e-report/
            packages/app-play/e2e-results/
          retention-days: 14
