<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 48 48">
  <!-- The tab icon (public/favicon.svg) as a maskable app icon: the same 7-key playfield, padded so the notes sit in
       the safe zone (a circle of 40% of the size around the centre) and a launcher's mask never cuts them. The lanes
       and the judge line run to the edges, so any mask shape still reads as the playfield. -->
  <rect x="-8" y="-8" width="48" height="48" fill="#0a0e18"/>

  <rect x="2"  y="-8" width="4" height="48" fill="#1c2138"/>
  <rect x="6"  y="-8" width="4" height="48" fill="#0e1326"/>
  <rect x="10" y="-8" width="4" height="48" fill="#1c2138"/>
  <rect x="14" y="-8" width="4" height="48" fill="#0e1326"/>
  <rect x="18" y="-8" width="4" height="48" fill="#1c2138"/>
  <rect x="22" y="-8" width="4" height="48" fill="#0e1326"/>
  <rect x="26" y="-8" width="4" height="48" fill="#1c2138"/>

  <rect x="2"  y="3"  width="4" height="3" fill="#ffffff"/>
  <rect x="14" y="3"  width="4" height="3" fill="#4ec9ff"/>
  <rect x="22" y="9"  width="4" height="3" fill="#4ec9ff"/>
  <rect x="6"  y="13" width="4" height="3" fill="#4ec9ff"/>
  <rect x="18" y="13" width="4" height="3" fill="#ffffff"/>
  <rect x="26" y="13" width="4" height="3" fill="#ffffff"/>
  <rect x="10" y="20" width="4" height="3" fill="#ffffff"/>
  <rect x="22" y="20" width="4" height="3" fill="#4ec9ff"/>

  <rect x="-8" y="26" width="48" height="1" fill="#ff3850" opacity="0.45"/>
  <rect x="-8" y="27" width="48" height="2" fill="#ff3850"/>
</svg>
