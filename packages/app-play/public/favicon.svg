<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- BMS 7-key playfield viewed from above. Alternating
       light/dark lanes mimic the white/black-key pattern, a
       handful of notes form a chord/stream, and a red bar at
       the bottom stands in for the judge line. -->
  <rect width="32" height="32" fill="#0a0e18"/>

  <!-- lanes: 7 of them, 4px wide, with 2px margin on each side -->
  <rect x="2"  width="4" height="32" fill="#1c2138"/>
  <rect x="6"  width="4" height="32" fill="#0e1326"/>
  <rect x="10" width="4" height="32" fill="#1c2138"/>
  <rect x="14" width="4" height="32" fill="#0e1326"/>
  <rect x="18" width="4" height="32" fill="#1c2138"/>
  <rect x="22" width="4" height="32" fill="#0e1326"/>
  <rect x="26" width="4" height="32" fill="#1c2138"/>

  <!-- falling notes: white on white-key lanes, cyan on black-key lanes -->
  <rect x="2"  y="3"  width="4" height="3" fill="#ffffff"/>
  <rect x="14" y="3"  width="4" height="3" fill="#4ec9ff"/>
  <rect x="22" y="9"  width="4" height="3" fill="#4ec9ff"/>
  <rect x="6"  y="13" width="4" height="3" fill="#4ec9ff"/>
  <rect x="18" y="13" width="4" height="3" fill="#ffffff"/>
  <rect x="26" y="13" width="4" height="3" fill="#ffffff"/>
  <rect x="10" y="20" width="4" height="3" fill="#ffffff"/>
  <rect x="22" y="20" width="4" height="3" fill="#4ec9ff"/>

  <!-- judge line: bright red bar near the bottom + dim afterglow -->
  <rect x="0" y="26" width="32" height="1" fill="#ff3850" opacity="0.45"/>
  <rect x="0" y="27" width="32" height="2" fill="#ff3850"/>
</svg>
