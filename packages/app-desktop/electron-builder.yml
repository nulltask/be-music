# Packaging for the desktop app (README.md, "Packaging"). Signing, notarization and auto-update are not set up yet:
# the macOS build is signed ad hoc and the Windows installer is unsigned.
appId: app.be-music.play
productName: Be-Music Play
copyright: Copyright © nulltask
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
mac:
  category: public.app-category.music
  icon: build/icon-mac.png
  # Ad hoc until a Developer ID certificate is set up; the hardened runtime comes with notarization.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Game
  target:
    - target: AppImage
      arch: [x64]
