<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The background of a chart's share card: the default card (og.svg) without its playfield, where the Worker draws
       the chart's own notes (src/chart-card/). scripts/build-icons.ts turns it into a palette image. Keep the text in
       step with og.svg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="80" y="250" font-size="96" font-weight="700" letter-spacing="-2">be-music</text>
    <text x="84" y="330" font-size="56" font-weight="400" fill="#9aa4bf">Leaderboard</text>
    <text x="86" y="430" font-size="30" font-weight="400" fill="#c7cde0">Rankings, replays and rivals</text>
    <text x="86" y="472" font-size="30" font-weight="400" fill="#c7cde0">for BMS players</text>
  </g>
</svg>
