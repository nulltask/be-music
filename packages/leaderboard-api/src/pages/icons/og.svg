<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The site's default share card (link previews of every page without a card of its own). Rendered to PNG by
       scripts/build-icons.ts. A 7-key playfield fills the right side, as in the site icon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0e18" stop-opacity="1"/>
      <stop offset="1" stop-color="#0a0e18" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- lanes -->
  <g transform="translate(700 0)">
    <rect x="0" width="70" height="630" fill="#1c2138"/>
    <rect x="70" width="70" height="630" fill="#0e1326"/>
    <rect x="140" width="70" height="630" fill="#1c2138"/>
    <rect x="210" width="70" height="630" fill="#0e1326"/>
    <rect x="280" width="70" height="630" fill="#1c2138"/>
    <rect x="350" width="70" height="630" fill="#0e1326"/>
    <rect x="420" width="70" height="630" fill="#1c2138"/>
    <!-- notes -->
    <rect x="4" y="60" width="62" height="22" rx="3" fill="#ffffff"/>
    <rect x="214" y="60" width="62" height="22" rx="3" fill="#4ec9ff"/>
    <rect x="284" y="170" width="62" height="22" rx="3" fill="#ffffff"/>
    <rect x="74" y="250" width="62" height="22" rx="3" fill="#4ec9ff"/>
    <rect x="424" y="250" width="62" height="22" rx="3" fill="#ffffff"/>
    <rect x="144" y="360" width="62" height="22" rx="3" fill="#ffffff"/>
    <rect x="354" y="360" width="62" height="22" rx="3" fill="#4ec9ff"/>
    <rect x="4" y="440" width="62" height="22" rx="3" fill="#ffffff"/>
    <!-- judge line -->
    <rect x="0" y="520" width="490" height="8" fill="#ff3850" opacity="0.45"/>
    <rect x="0" y="528" width="490" height="12" fill="#ff3850"/>
  </g>
  <rect x="560" width="300" height="630" fill="url(#fade)"/>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="80" y="250" font-size="96" font-weight="700" letter-spacing="-2">be-music</text>
    <text x="84" y="330" font-size="56" font-weight="400" fill="#9aa4bf">Leaderboard</text>
    <text x="86" y="430" font-size="30" font-weight="400" fill="#c7cde0">Rankings, replays and rivals</text>
    <text x="86" y="472" font-size="30" font-weight="400" fill="#c7cde0">for BMS players</text>
  </g>
</svg>
